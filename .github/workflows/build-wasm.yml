# =============================================================
# build-wasm.yml  –  CI pipeline: compile sim_core to WebAssembly
#
# Triggers:
#   • push / PR touching cpp/, src/wasm/, generated/*.h, physics/, or the
#     build/codegen scripts — everything compiled into sim_core.wasm
#   • manual workflow_dispatch
#
# Artefacts:
#   • sim_core.js + sim_core.wasm  (uploaded as GitHub artefact)
#   • Committed back to src/wasm/sim-core/ on the main branch
#
# emsdk: cpp/emsdk-version is the one pin (scripts/build-wasm.sh warns on a
# mismatch; cpp/README.md points at it).
# =============================================================

name: Build WASM (sim_core)

on:
  push:
    paths:
      - 'cpp/**'
      - 'src/wasm/**'
      # Compiled into the binary: codegen headers and their sources.
      - 'generated/*.h'
      - 'physics/**'
      - 'scripts/build-wasm.sh'
      - 'scripts/codegen-*.mjs'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'src/wasm/**'
      # Compiled into the binary: codegen headers and their sources.
      - 'generated/*.h'
      - 'physics/**'
      - 'scripts/build-wasm.sh'
      - 'scripts/codegen-*.mjs'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    name: Emscripten → WASM
    runs-on: ubuntu-latest

    # Allow write access only when committing artefacts back to main.
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install emsdk (version from cpp/emsdk-version) ────
      - name: Read emsdk pin
        id: emsdk
        run: echo "version=$(tr -d '[:space:]' < cpp/emsdk-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: '.emsdk-cache'

      # ── 3. Verify emcc ───────────────────────────────────────
      - name: Verify emcc
        run: emcc --version

      # ── 4. Native smoke (no emcc; catches C++ regressions early)
      - name: Native sim_core smoke test
        run: bash scripts/build-wasm.sh --native

      # ── 5. Build WASM via portable wrapper (emcc on PATH from setup-emsdk)
      - name: Build sim_core WASM
        run: bash scripts/build-wasm.sh

      # ── 6. Verify output ─────────────────────────────────────
      - name: Verify artefacts
        run: |
          ls -lh src/wasm/sim-core/
          test -f src/wasm/sim-core/sim_core.js   || (echo "sim_core.js missing" && exit 1)
          test -f src/wasm/sim-core/sim_core.wasm || (echo "sim_core.wasm missing" && exit 1)

      # ── 6a. ABI: every Embind export callable from JS on the fresh build
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # validate.yml tests the *committed* binary; these run on the one just
      # built, so a physics/ or generated/ edit cannot pass against a stale
      # sim_core.wasm.
      # SIM_CORE_REQUIRE_FRESH: the binary's sim_core_source_hash() must equal
      # the hash of the sources it was just built from.
      - name: WASM ABI test (fresh build)
        env:
          SIM_CORE_REQUIRE_FRESH: '1'
        run: npm ci && npm run test:wasm-abi

      # Every suite that loads src/wasm/sim-core/sim_core.{js,wasm}. (test:golden
      # compares the TS plant against the *native* binary built in step 4, so
      # it runs too, but it does not exercise the .wasm.)
      - name: Fresh-build WASM suites (snapshots, analysis, experiments) + golden
        run: |
          npm run test:snapshots
          npm run test:analysis
          npm run test:experiments
          npm run test:golden

      # ── 6b. Size / bench note ─────────────────────────────────
      #    Logs sim_core.js/.wasm raw+gzip bytes and the native
      #    sim_core_test step rate on every run, so a future compile-flag
      #    change (SIMD, LTO, …) shows up as a diff in the Actions log
      #    instead of regressing silently.
      - name: Size / bench note
        run: |
          {
            echo "### sim_core size / bench note"
            echo
            echo "| Artefact | Raw bytes | Gzip bytes |"
            echo "|---|---|---|"
            for f in src/wasm/sim-core/sim_core.js src/wasm/sim-core/sim_core.wasm; do
              raw=$(stat -c%s "$f")
              gz=$(gzip -9 -c "$f" | wc -c)
              echo "| $f | $raw | $gz |"
            done
            echo
            echo "\`\`\`"
            ./cpp/build/sim_core_test --mode bench
            echo "\`\`\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ── 7. Upload artefacts ──────────────────────────────────
      - name: Upload WASM artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sim_core-wasm
          path: |
            src/wasm/sim-core/sim_core.js
            src/wasm/sim-core/sim_core.wasm
          retention-days: 30

      # ── 8. Commit built files back on main (optional) ────────
      #    Enables the GitHub Pages deploy to serve the WASM without
      #    requiring a separate download / install step.
      - name: Commit WASM artefacts to main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/wasm/sim-core/sim_core.js src/wasm/sim-core/sim_core.wasm
          git diff --cached --quiet || \
            git commit -m "ci: update sim_core WASM artefacts [skip ci]" && \
            git push
