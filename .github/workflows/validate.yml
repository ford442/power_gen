# =============================================================
# validate.yml — non-deploy CI
#
# `validate` runs `npm run validate` — the whole package.json suite, so CI and
# the local promise cannot drift (no hand-picked subset here). Add a step to
# that script, not to this file.
#
# Runs on PRs and pushes (does not deploy Pages).
# Pages deploy remains in static.yml (typecheck + build:site).
# =============================================================

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: npm run validate + site build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install C++ toolchain (wasm:native, test:snapshots)
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin (naga)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: naga-cli-0.19.0-${{ runner.os }}

      - name: Install naga-cli
        run: |
          if ! command -v naga >/dev/null 2>&1; then
            cargo install naga-cli --version 0.19.0 --locked
          fi
          naga --version || true

      - name: npm run validate
        env:
          REQUIRE_NAGA: '1'
        run: npm run validate

      # validate re-runs every codegen step; a diff means a committed
      # generated file is stale.
      - name: Generated files committed
        run: git diff --exit-code

      - name: Build site (no WASM rebuild)
        run: npm run build:site

  native-san:
    name: C++ sanitizers + optional WASM build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make

      # Probes for a compiler whose ASan/UBSan runtimes link and run; skips
      # (exit 0) on images without them, so this never reds a gcc-only job.
      - name: Native sim_core under ASan + UBSan
        run: npm run wasm:native:san

      - name: WASM build (only if Emscripten is on PATH)
        run: |
          if command -v emcc >/dev/null 2>&1; then
            echo "emcc found ($(emcc --version | head -1)) — building sim_core WASM"
            npm run wasm:build
          else
            echo "emcc not on PATH — skipping WASM build (validate job already ran the native smoke test)"
          fi

  e2e:
    name: Playwright (WebGL2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (WebGL2)
        run: npm run test:e2e

      # Service worker only exists in a production build: vite preview of a
      # fresh build:site, its own port (docs/CLASSROOM.md).
      - name: E2E offline PWA (precache, offline reload, prompt-based update)
        run: npm run test:e2e:offline
